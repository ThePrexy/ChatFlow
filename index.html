<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatFlow - Sistema de Mensajería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Auth Screen */
        .auth-screen {
            display: flex;
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .auth-screen.hidden {
            display: none;
        }

        .auth-container {
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }

        .auth-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .auth-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 40px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .auth-btn {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .auth-btn:hover {
            transform: scale(1.02);
        }

        .auth-toggle {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .auth-toggle button {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        .auth-users {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
            background: #f5f7ff;
            padding: 12px 15px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.5;
        }

        .auth-users strong {
            display: block;
            margin-bottom: 6px;
            color: #333;
        }

        /* Chat Screen */
        .chat-screen {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .chat-screen.hidden {
            display: none;
        }

        .sidebar {
            width: 280px;
            background: #f7f7f7;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .sidebar-header .logo {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .sidebar-header .title {
            font-size: 18px;
            font-weight: bold;
        }

        .sidebar-header .subtitle {
            font-size: 10px;
            opacity: 0.85;
            margin-top: 5px;
            font-weight: normal;
        }

        .user-info {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            background: #fff;
        }

        .user-info-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .user-info-name {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logout-btn {
            width: 100%;
            padding: 8px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .contacts-title {
            padding: 15px 20px;
            font-size: 12px;
            color: #666;
            font-weight: bold;
            text-transform: uppercase;
            background: #fff;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 12px 15px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            color: #333;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .contact-item:hover {
            background: #e8e8e8;
        }

        .contact-item.active {
            background: #e3f2fd;
            border-left-color: #667eea;
            font-weight: bold;
        }

        .contact-item .status {
            font-size: 10px;
            color: #999;
            margin-top: 3px;
        }

        .contact-item .status.online::before {
            content: "● ";
            color: #4caf50;
        }

        .contact-item .status.offline::before {
            content: "● ";
            color: #999;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            color: #333;
            font-size: 18px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages-container.empty {
            justify-content: center;
            align-items: center;
            color: #999;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
            align-items: flex-end;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 10px;
            word-break: break-word;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.other .message-bubble {
            background: #e8e8e8;
            color: #333;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
        }

        .message.own .message-time {
            text-align: right;
            color: #667eea;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        .input-area button:active {
            transform: scale(0.98);
        }

        .no-contact {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .no-contact p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .no-contact small {
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .chat-screen {
                flex-direction: column;
            }

            .message-bubble {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-container">
            <div class="auth-logo">💬</div>
            <div class="auth-title" id="authTitle">Bienvenido a ChatFlow</div>
            <div class="auth-subtitle">Sistema de Mensajería</div>

            <div class="auth-form" id="authForm">
                <input type="text" id="authUsername" placeholder="Usuario" />
                <input type="password" id="authPassword" placeholder="Contraseña" />
                <button class="auth-btn" onclick="handleAuth()">Iniciar Sesión</button>
            </div>

            <div class="auth-toggle">
                ¿No tienes cuenta? <button onclick="toggleAuthMode()">Crear una</button>
            </div>

            <div class="auth-users" id="authUsers">
                <strong>Usuarios registrados</strong>
                <span id="authUsersList">No hay usuarios registrados.</span>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-screen hidden" id="chatScreen">
        <!-- Sidebar -->
        <div class="sidebar">
        <!-- Sidebar -->
            <div class="sidebar-header">
                <div class="logo">💬</div>
                <div class="title">ChatFlow</div>
                <div class="subtitle">Chats & Conversations</div>
            </div>

            <div class="user-info">
                <div class="user-info-label">Conectado como:</div>
                <div class="user-info-name" id="currentUserDisplay">Usuario</div>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>

            <div class="contacts-title">Contactos</div>
            <div class="contacts-list" id="contactsList"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <h2 id="chatTitle">Selecciona un contacto</h2>
            </div>

            <div class="messages-container empty" id="messagesContainer">
                <div class="no-contact">
                    <p>👋 Selecciona un contacto</p>
                    <small>Elige una persona de la lista para comenzar a chatear</small>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display: none;">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Escribe un mensaje..."
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Storage keys
        const USERS_KEY = 'chatflow_users';
        const CONVERSATIONS_KEY = 'chatflow_conversations';
        const CURRENT_USER_KEY = 'chatflow_current_user';

        // State
        let users = [];
        let conversations = [];
        let currentUser = null;
        let currentChatWith = null;
        let authMode = 'login';

        // Initialize
        function init() {
            loadUsers();
            loadConversations();
            checkLoggedIn();
        }

        // Load users from storage
        function loadUsers() {
            const saved = localStorage.getItem(USERS_KEY);
            users = saved ? JSON.parse(saved) : [];
            updateAuthUserList();
        }

        // Save users
        function saveUsers() {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            updateAuthUserList();
        }

        function updateAuthUserList() {
            const list = document.getElementById('authUsersList');
            if (!list) return;
            const names = users.length ? users.map(user => user.username) : [];
            list.textContent = names.length
                ? names.join(', ')
                : 'No hay usuarios registrados.';
        }

        // Load conversations
        function loadConversations() {
            const saved = localStorage.getItem(CONVERSATIONS_KEY);
            conversations = saved ? JSON.parse(saved) : [];
        }

        // Save conversations
        function saveConversations() {
            localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(conversations));
        }

        // Check if user is logged in
        function checkLoggedIn() {
            const saved = localStorage.getItem(CURRENT_USER_KEY);
            if (saved) {
                currentUser = JSON.parse(saved);
                showChatScreen();
            } else {
                showAuthScreen();
            }
        }

        // Toggle between login and register
        function toggleAuthMode() {
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('authTitle').textContent = 
                authMode === 'login' ? 'Bienvenido a ChatFlow' : 'Crear Nueva Cuenta';
            const btn = document.querySelector('.auth-form button');
            btn.textContent = authMode === 'login' ? 'Iniciar Sesión' : 'Registrarse';
            const toggle = document.querySelector('.auth-toggle');
            toggle.innerHTML = authMode === 'login'
                ? '¿No tienes cuenta? <button onclick="toggleAuthMode()">Crear una</button>'
                : '¿Ya tienes cuenta? <button onclick="toggleAuthMode()">Inicia sesión</button>';
        }

        // Handle authentication
        function handleAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;

            if (!username || !password) {
                alert('Por favor completa todos los campos');
                return;
            }

            if (authMode === 'register') {
                registerUser(username, password);
            } else {
                loginUser(username, password);
            }
        }

        // Register user
        function registerUser(username, password) {
            if (users.find(u => u.username === username)) {
                alert('El usuario ya existe');
                return;
            }

            const newUser = { id: Date.now().toString(), username, password };
            users.push(newUser);
            saveUsers();
            currentUser = newUser;
            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser));
            authMode = 'login';
            showChatScreen();
        }

        // Login user
        function loginUser(username, password) {
            const user = users.find(u => u.username === username && u.password === password);
            if (!user) {
                alert('Usuario o contraseña incorrectos');
                return;
            }

            currentUser = user;
            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser));
            showChatScreen();
        }

        // Logout
        function logout() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                currentUser = null;
                currentChatWith = null;
                localStorage.removeItem(CURRENT_USER_KEY);
                authMode = 'login';
                document.getElementById('authUsername').value = '';
                document.getElementById('authPassword').value = '';
                showAuthScreen();
            }
        }

        // Show auth screen
        function showAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('chatScreen').classList.add('hidden');
            updateAuthUserList();
        }

        // Show chat screen
        function showChatScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('currentUserDisplay').textContent = currentUser.username;
            renderContacts();
            renderMessages();
        }

        // Render contacts
        function renderContacts() {
            const list = document.getElementById('contactsList');
            list.innerHTML = '';

            const otherUsers = users.filter(user => user.id !== currentUser.id);
            if (otherUsers.length === 0) {
                const placeholder = document.createElement('div');
                placeholder.className = 'contact-item';
                placeholder.style.cursor = 'default';
                placeholder.style.background = '#f7f7f7';
                placeholder.style.color = '#999';
                placeholder.textContent = 'No hay otros usuarios registrados. Crea otra cuenta o inicia sesión con otro usuario.';
                list.appendChild(placeholder);
                return;
            }

            otherUsers.forEach(user => {
                const item = document.createElement('div');
                item.className = 'contact-item';
                if (currentChatWith && currentChatWith.id === user.id) {
                    item.classList.add('active');
                }
                item.innerHTML = `
                    <div>${user.username}</div>
                    <div class="status online">En línea</div>
                `;
                item.onclick = () => selectContact(user);
                list.appendChild(item);
            });
        }

        // Select contact to chat
        function selectContact(contact) {
            currentChatWith = contact;
            renderContacts();
            renderMessages();
        }

        // Generate conversation ID
        function getConversationId(user1Id, user2Id) {
            const ids = [user1Id, user2Id].sort();
            return ids[0] + '_' + ids[1];
        }

        // Get or create conversation
        function getConversation(otherUserId) {
            const convId = getConversationId(currentUser.id, otherUserId);
            let conv = conversations.find(c => c.id === convId);

            if (!conv) {
                conv = {
                    id: convId,
                    user1Id: currentUser.id,
                    user2Id: otherUserId,
                    messages: []
                };
                conversations.push(conv);
                saveConversations();
            }

            return conv;
        }

        // Render messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const header = document.getElementById('chatTitle');
            const inputArea = document.getElementById('inputArea');

            if (!currentChatWith) {
                container.innerHTML = `
                    <div class="no-contact">
                        <p>👋 Selecciona un contacto</p>
                        <small>Elige una persona de la lista para comenzar a chatear</small>
                    </div>
                `;
                inputArea.style.display = 'none';
                return;
            }

            const conversation = getConversation(currentChatWith.id);
            header.textContent = currentChatWith.username;
            inputArea.style.display = 'flex';

            const messages = conversation.messages;
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="no-contact">
                        <p>💭 Inicio de conversación</p>
                        <small>Sé el primero en escribir un mensaje</small>
                    </div>
                `;
                container.classList.add('empty');
            } else {
                container.innerHTML = '';
                container.classList.remove('empty');
                messages.forEach(msg => {
                    const msgEl = document.createElement('div');
                    msgEl.className = `message ${msg.senderId === currentUser.id ? 'own' : 'other'}`;
                    const time = new Date(msg.timestamp).toLocaleTimeString('es-ES', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    const senderName = msg.senderId === currentUser.id ? 'Tú' : currentChatWith.username;
                    msgEl.innerHTML = `
                        <div>
                            <div class="message-bubble">${escapeHtml(msg.text)}</div>
                            <div class="message-time">${senderName} • ${time}</div>
                        </div>
                    `;
                    container.appendChild(msgEl);
                });
            }

            container.scrollTop = container.scrollHeight;
        }

        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentChatWith) return;

            const conversation = getConversation(currentChatWith.id);
            conversation.messages.push({
                id: Date.now().toString(),
                senderId: currentUser.id,
                text: text,
                timestamp: new Date().toISOString()
            });

            saveConversations();
            input.value = '';
            renderMessages();
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Start app
        init();
    </script>
</body>
</html>
