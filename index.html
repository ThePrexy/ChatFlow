<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatFlow - Sistema de Mensajería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #f7f7f7;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .sidebar-header .logo {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .sidebar-header .title {
            font-size: 18px;
            font-weight: bold;
        }

        .sidebar-header .subtitle {
            font-size: 10px;
            opacity: 0.85;
            margin-top: 5px;
            font-weight: normal;
        }

        .user-section {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .user-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .user-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .conversations-title {
            padding: 15px 20px;
            font-size: 12px;
            color: #666;
            font-weight: bold;
            text-transform: uppercase;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 12px 15px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            color: #333;
            font-size: 14px;
        }

        .conversation-item:hover {
            background: #e8e8e8;
        }

        .conversation-item.active {
            background: #e3f2fd;
            border-left-color: #667eea;
            font-weight: bold;
        }

        .new-conversation-btn {
            margin: 15px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .new-conversation-btn:hover {
            transform: scale(1.02);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            color: #333;
            font-size: 18px;
        }

        .chat-header .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .chat-header .delete-btn:hover {
            background: #ff5252;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .messages-container.empty {
            justify-content: center;
            align-items: center;
            color: #999;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 15px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.other .message-content {
            background: #e8e8e8;
            color: #333;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-time {
            font-size: 12px;
            color: #999;
            align-self: flex-end;
            margin-top: 5px;
        }

        .message.own .message-time {
            text-align: right;
            color: #667eea;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        .input-area button:active {
            transform: scale(0.98);
        }

        .no-conversation {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .no-conversation p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .no-conversation small {
            font-size: 12px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .modal-btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .modal-btn-cancel:hover {
            background: #e0e0e0;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn-confirm:hover {
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .container {
                flex-direction: column;
            }

            .message-content {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">💬</div>
                <div class="title">ChatFlow</div>
                <div class="subtitle">Chats & Conversations</div>
            </div>
            
            <div class="user-section">
                <label for="username">Tu usuario:</label>
                <input type="text" id="username" placeholder="Ingresa tu nombre" value="Tú">
            </div>

            <div class="conversations-title">Conversaciones</div>
            <div class="conversations-list" id="conversationsList"></div>

            <button class="new-conversation-btn" onclick="createNewConversation()">
                + Nueva Conversación
            </button>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <h2 id="chatTitle">Selecciona una conversación</h2>
                <button class="delete-btn" id="deleteBtn" onclick="deleteCurrentConversation()" style="display: none;">
                    Eliminar
                </button>
            </div>

            <div class="messages-container empty" id="messagesContainer">
                <div class="no-conversation">
                    <p>📭 No hay mensajes</p>
                    <small>Crea una nueva conversación para comenzar</small>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display: none;">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Escribe un mensaje..."
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal for new conversation -->
    <div class="modal" id="newConversationModal">
        <div class="modal-content">
            <div style="text-align: center; margin-bottom: 15px;">
                <div style="font-size: 28px; margin-bottom: 8px;">💬</div>
                <div class="modal-title">Nueva Conversación en ChatFlow</div>
            </div>
            <input 
                type="text" 
                id="conversationNameInput" 
                class="modal-input" 
                placeholder="Nombre de la conversación"
                onkeypress="handleModalKeyPress(event)"
            >
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeNewConversationModal()">Cancelar</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmNewConversation()">Crear</button>
            </div>
        </div>
    </div>

    <script>
        const USERNAME_KEY = 'username';
        const CONVERSATIONS_KEY = 'conversations';

        // State
        let conversations = [];
        let currentConversationId = null;
        let currentUsername = 'Tú';

        // Initialize
        function init() {
            loadUsername();
            loadConversations();
            renderConversations();
            
            document.getElementById('username').addEventListener('change', (e) => {
                currentUsername = e.target.value || 'Tú';
                localStorage.setItem(USERNAME_KEY, currentUsername);
            });
        }

        // Load username
        function loadUsername() {
            const saved = localStorage.getItem(USERNAME_KEY);
            if (saved) {
                currentUsername = saved;
                document.getElementById('username').value = currentUsername;
            }
        }

        // Load conversations from storage
        function loadConversations() {
            const saved = localStorage.getItem(CONVERSATIONS_KEY);
            if (saved) {
                conversations = JSON.parse(saved);
            } else {
                // Create default conversation
                conversations = [
                    {
                        id: generateId(),
                        title: 'General',
                        messages: []
                    }
                ];
                saveConversations();
            }
        }

        // Save conversations to storage
        function saveConversations() {
            localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(conversations));
        }

        // Generate unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Create new conversation
        function createNewConversation() {
            document.getElementById('conversationNameInput').value = '';
            document.getElementById('newConversationModal').classList.add('active');
            document.getElementById('conversationNameInput').focus();
        }

        // Close modal
        function closeNewConversationModal() {
            document.getElementById('newConversationModal').classList.remove('active');
        }

        // Confirm new conversation
        function confirmNewConversation() {
            const title = document.getElementById('conversationNameInput').value.trim();
            if (!title) {
                alert('Por favor ingresa un nombre para la conversación');
                return;
            }

            const conversation = {
                id: generateId(),
                title: title,
                messages: []
            };
            conversations.push(conversation);
            saveConversations();
            closeNewConversationModal();
            renderConversations();
            selectConversation(conversation.id);
        }

        // Handle modal Enter key
        function handleModalKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                confirmNewConversation();
            }
        }

        // Select conversation
        function selectConversation(id) {
            currentConversationId = id;
            renderConversations();
            renderMessages();
        }

        // Delete current conversation
        function deleteCurrentConversation() {
            if (!currentConversationId) return;
            if (confirm('¿Estás seguro de que deseas eliminar esta conversación?')) {
                conversations = conversations.filter(c => c.id !== currentConversationId);
                currentConversationId = null;
                saveConversations();
                renderConversations();
                renderMessages();
            }
        }

        // Render conversations list
        function renderConversations() {
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';

            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conversation-item';
                if (conv.id === currentConversationId) {
                    item.classList.add('active');
                }
                item.textContent = conv.title;
                item.onclick = () => selectConversation(conv.id);
                list.appendChild(item);
            });
        }

        // Render messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const header = document.getElementById('chatTitle');
            const inputArea = document.getElementById('inputArea');
            const deleteBtn = document.getElementById('deleteBtn');

            if (!currentConversationId) {
                container.innerHTML = `
                    <div class="no-conversation">
                        <p>� Bienvenido a ChatFlow</p>
                        <small>Selecciona o crea una conversación para comenzar</small>
                    </div>
                `;
                inputArea.style.display = 'none';
                deleteBtn.style.display = 'none';
                return;
            }

            const conversation = conversations.find(c => c.id === currentConversationId);
            if (!conversation) return;

            header.textContent = conversation.title;
            deleteBtn.style.display = 'block';
            inputArea.style.display = 'flex';

            const messages = conversation.messages;
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="no-conversation">
                        <p>� Inicio de conversación</p>
                        <small>Sé el primero en escribir un mensaje</small>
                    </div>
                `;
                container.classList.add('empty');
            } else {
                container.innerHTML = '';
                container.classList.remove('empty');
                messages.forEach(msg => {
                    const msgEl = document.createElement('div');
                    msgEl.className = `message ${msg.sender === currentUsername ? 'own' : 'other'}`;
                    const time = new Date(msg.timestamp).toLocaleTimeString('es-ES', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    msgEl.innerHTML = `
                        <div>
                            <div class="message-content">${escapeHtml(msg.text)}</div>
                            <div class="message-time">${msg.sender} • ${time}</div>
                        </div>
                    `;
                    container.appendChild(msgEl);
                });
            }

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentConversationId) return;

            const conversation = conversations.find(c => c.id === currentConversationId);
            if (!conversation) return;

            conversation.messages.push({
                id: generateId(),
                text: text,
                sender: currentUsername,
                timestamp: new Date().toISOString()
            });

            saveConversations();
            input.value = '';
            renderMessages();
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Start the app
        init();
    </script>
</body>
</html>
